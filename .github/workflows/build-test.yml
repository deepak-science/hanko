name: build-test
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
            package: default
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            package: default
          # Cross-compiled; see hanko-darwin-arm64 in flake.nix.
          - target: darwin-arm64
            runs-on: ubuntu-latest
            package: hanko-darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # The darwin cross-build shares a runner arch with linux-amd64, so it gets a prefix of its own that the linux-amd64 purge can't match.
          primary-key: nix-${{ matrix.target == 'darwin-arm64' && 'cross-darwin-arm64' || format('{0}-{1}', runner.os, runner.arch) }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.target == 'darwin-arm64' && 'cross-darwin-arm64' || format('{0}-{1}', runner.os, runner.arch) }}-
          # Cap the saved /nix/store at 3 GB so the three caches stay under GitHub's 10 GB repo limit.
          gc-max-store-size-linux: 3221225472
          # Drop stale caches for this prefix on every run, keeping only the one we just saved.
          purge: true
          purge-prefixes: nix-${{ matrix.target == 'darwin-arm64' && 'cross-darwin-arm64' || format('{0}-{1}', runner.os, runner.arch) }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --print-build-logs
        if: startsWith(matrix.target, 'linux-')
      - name: Build hanko
        run: |
          nix build --print-build-logs .#${{ matrix.package }}
          cp ./result/bin/hanko hanko-${{ matrix.target }}
      - name: Compute checksums
        run: shasum -a 256 hanko-${{ matrix.target }} > checksums-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hanko-${{ matrix.target }}
          path: |
            hanko-${{ matrix.target }}
            checksums-${{ matrix.target }}.txt
          retention-days: 7
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hanko-*
          merge-multiple: true
      - name: Assemble combined checksums
        run: cat checksums-*.txt | sort > checksums.txt
      - name: Stage install script for upload
        run: cp scripts/install.sh install.sh
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=(
            hanko-linux-amd64
            hanko-linux-arm64
            hanko-darwin-arm64
            checksums.txt
            install.sh
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" --generate-notes "${FILES[@]}"
          fi
  publish-tap:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
      - name: Update Formula/hanko.rb
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p checksums.txt
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          scripts/brew-formula.sh "$TAG" checksums.txt > tap/Formula/hanko.rb
          cd tap
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/hanko.rb
          git diff --cached --quiet || { git commit -qm "hanko ${TAG#v}" && git push -q; }
