# git-cliff config for hanko's own CHANGELOG.md.
# Regenerated in full by the `seal.pre-commit` hook in .hanko.yaml, so the release commit carries its own entry.

[changelog]
header = """
# Changelog

All notable changes to hanko. Generated by [git-cliff](https://git-cliff.org) from conventional commits.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Pre-convention history and merge commits stay out of the changelog.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# HTML-comment prefixes only fix section order; striptags drops them on render.
# Anything not listed (build, ci, chore, test, …) is left out.
commit_parsers = [
  { message = "^chore: Release ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactors" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = ".*", skip = true },
]
